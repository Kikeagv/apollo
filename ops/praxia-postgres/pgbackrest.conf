# pgBackRest para Praxia. Repositorio en Cloudflare R2 (S3-compatible).
# Los secretos NO van aquí: pgBackRest escanea /etc/pgbackrest/conf.d/*.conf
# junto con este archivo. El contenedor monta el secrets.conf del host en
# /etc/pgbackrest/conf.d/secrets.conf (Custom Docker Options de Coolify):
#   -v /data/praxia-pgbackrest/secrets.conf:/etc/pgbackrest/conf.d/secrets.conf:ro
# (la opción `include` no existe en pgBackRest 2.58).

[global]
repo1-type=s3
repo1-path=/praxia-pgbackrest
repo1-retention-full=30
repo1-retention-archive-type=full
repo1-s3-endpoint=https://0c8fe441245c7b293ac0be5d2b7ecfdf.r2.cloudflarestorage.com
repo1-s3-bucket=praxia-production-backups
repo1-s3-region=auto
repo1-s3-uri-style=path
process-max=2
compress-type=lz4
start-fast=y
log-path=/var/spool/pgbackrest

[main]
pg1-path=/var/lib/postgresql/data
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
