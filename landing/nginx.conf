server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = / {
        try_files /index.html =404;
    }

    # /demo también es un directorio de archivos auxiliares; fuerza el
    # documento público en vez de dejar que try_files intente servirlo como
    # índice de directorio.
    location = /demo {
        try_files /demo.html =404;
    }

    location = /demo/recibido {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /demo/recibido.html =404;
    }

    location /public/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        # /privacidad -> /privacidad.html, /terminos -> /terminos.html
        try_files $uri $uri.html =404;
    }
}
